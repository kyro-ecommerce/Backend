server:
  port: ${PORT:8080}

api:
  prefix: ${API_PREFIX:/api/v1}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:true}
        globally_quoted_identifiers: ${JPA_GLOBALLY_QUOTED_IDENTIFIERS:false}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAUTH2_GOOGLE_CLIENT_ID:mock-google-client-id}
            client-secret: ${OAUTH2_GOOGLE_CLIENT_SECRET:mock-google-client-secret}
            scope: profile,email
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:mock_email@gmail.com}
    password: ${MAIL_PASSWORD:mock_password}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}

auth:
  token:
    jwtSecret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    accessExpirationInMils: ${JWT_ACCESS_EXPIRATION_MS:3600000}
    refreshExpirationInMils: ${JWT_REFRESH_EXPIRATION_MS:86400000}

app:
  useSecureCookie: ${USE_SECURE_COOKIE:false}
  otp:
    expiration-minutes: ${OTP_EXPIRATION_MINUTES:10}
    resend-cooldown-minutes: ${OTP_RESEND_COOLDOWN_MINUTES:1}
  company:
    logo:
      url: ${COMPANY_LOGO_URL:https://kyro.com/logo.png}
  oauth2:
    redirectUri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/redirect}
    failureRedirectUri: ${OAUTH2_FAILURE_REDIRECT_URI:http://localhost:3000/login?error=true}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

cloudinary:
  cloudName: ${CLOUDINARY_CLOUD_NAME:mock_cloud}
  apiKey: ${CLOUDINARY_API_KEY:mock_key}
  apiSecret: ${CLOUDINARY_API_SECRET:mock_secret}
  apiSecure: ${CLOUDINARY_API_SECURE:true}

vnpay:
  tmn-code: ${VNPAY_TMN_CODE:mock_code}
  hash-secret: ${VNPAY_HASH_SECRET:mock_secret}
  pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/v1/payment/vnpay-callback}

contact:
  info:
    phone: ${CONTACT_PHONE:0123456789}
    email: ${CONTACT_EMAIL:contact@kyro.com}
    address: ${CONTACT_ADDRESS:123 Street, City}
    businessHours: ${CONTACT_BUSINESS_HOURS:9 AM - 6 PM}
    facebook: ${CONTACT_FACEBOOK:https://facebook.com/kyro}
    instagram: ${CONTACT_INSTAGRAM:https://instagram.com/kyro}
    youtube: ${CONTACT_YOUTUBE:https://youtube.com/kyro}

logging:
  level:
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false
