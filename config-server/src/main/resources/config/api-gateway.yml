server:
  port: 8080

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:5174"
              - "http://localhost:3000"
              - "http://localhost:8080"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        # Route to Auth Service
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**, /oauth2/**, /login/oauth2/code/**
          filters:
            - StripPrefix=0

        # Route to Cart Service with Authentication Filter
        - id: cart-service
          uri: lb://cart-service
          predicates:
            - Path=/api/v1/carts/**
          filters:
            - StripPrefix=0
            - AuthenticationFilter

        # Route to Catalog Service (Public)
        - id: catalog-service-public
          uri: lb://catalog-service
          predicates:
            - Path=/api/v1/products, /api/v1/products/*, /api/v1/categories/**, /api/v1/reviews/product/**
          filters:
            - StripPrefix=0

        # Route to Catalog Service Reviews (Authenticated)
        - id: catalog-service-reviews
          uri: lb://catalog-service
          predicates:
            - Path=/api/v1/reviews/**
          filters:
            - StripPrefix=0
            - AuthenticationFilter

        # Route to Catalog Service Admin Products (Authenticated)
        - id: catalog-service-admin
          uri: lb://catalog-service
          predicates:
            - Path=/api/v1/admin/products/**
          filters:
            - StripPrefix=0
            - AuthenticationFilter=ADMIN

        # Route to Auth Service Admin Users (Authenticated)
        - id: auth-service-admin
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/admin/users/**
          filters:
            - StripPrefix=0
            - AuthenticationFilter=ADMIN

        # Route to Order Service with Authentication Filter
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - StripPrefix=0
            - AuthenticationFilter

        # Route to Order Service Admin (Authenticated)
        - id: order-service-admin
          uri: lb://order-service
          predicates:
            - Path=/api/v1/admin/orders/**
          filters:
            - StripPrefix=0
            - AuthenticationFilter=ADMIN

        # Route to Payment Service (Public Callbacks)
        - id: payment-service-public
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/vnpay-callback
          filters:
            - StripPrefix=0

        # Route to Payment Service (Authenticated)
        - id: payment-service-authenticated
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - StripPrefix=0
            - AuthenticationFilter

        # Route to AI Service (Public with Rate Limiter & Circuit Breaker)
        - id: ai-service-public
          uri: ${AI_SERVICE_URI:http://kyro-ai-service:8000}
          predicates:
            - Path=/api/v1/ai/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"
            - name: CircuitBreaker
              args:
                name: aiServiceCircuitBreaker
                fallbackUri: forward:/fallback/ai

        # Fallback Route to Monolith (if anything remains)
        - id: kyro-monolith
          uri: lb://kyro-monolith
          predicates:
            - Path=/api/v1/**
          filters:
            - StripPrefix=0


        # --- OpenAPI Docs Routes for Downstream Services ---
        - id: auth-service-docs
          uri: lb://auth-service
          predicates:
            - Path=/auth-service/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

        - id: catalog-service-docs
          uri: lb://catalog-service
          predicates:
            - Path=/catalog-service/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

        - id: cart-service-docs
          uri: lb://cart-service
          predicates:
            - Path=/cart-service/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

        - id: order-service-docs
          uri: lb://order-service
          predicates:
            - Path=/order-service/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

        - id: payment-service-docs
          uri: lb://payment-service
          predicates:
            - Path=/payment-service/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

        - id: notification-service-docs
          uri: lb://notification-service
          predicates:
            - Path=/notification-service/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

auth:
  token:
    jwtSecret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

springdoc:
  api-docs:
    enabled: true

scalar:
  enabled: true
  sources:
    - title: Auth Service
      url: /auth-service/v3/api-docs
    - title: Catalog Service
      url: /catalog-service/v3/api-docs
    - title: Cart Service
      url: /cart-service/v3/api-docs
    - title: Order Service
      url: /order-service/v3/api-docs
    - title: Payment Service
      url: /payment-service/v3/api-docs
    - title: Notification Service
      url: /notification-service/v3/api-docs
