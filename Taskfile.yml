version: "3"

dotenv: ['.env']

vars:
  MVNW_CMD: '{{if eq OS "windows"}}mvnw.cmd{{else}}./mvnw{{end}}'

tasks:
  default:
    desc: "Danh sách tất cả các lệnh Taskfile khả dụng"
    cmds:
      - task --list

  # =========================================================================
  # 🚀 1. LỆNH CHÍNH (MAIN WORKFLOW - MULTI-STAGE DOCKER)
  # =========================================================================

  run:
    desc: "Chạy TOÀN BỘ hệ thống Microservices trong Docker (Multi-stage Build tự động)"
    aliases: [up, dev]
    cmds:
      - docker compose up --build -d --wait

  stop:
    desc: "Dừng tất cả các Docker containers đang chạy"
    aliases: [down]
    cmds:
      - docker compose down

  clean:
    desc: "Dừng hệ thống và XÓA SẠCH Database Volumes / Cache"
    aliases: [down-v, db:down-v]
    cmds:
      - docker compose down -v

  status:
    desc: "Xem trạng thái sức khỏe của tất cả Docker containers"
    cmds:
      - docker compose ps

  logs:
    desc: "Mở trang UI Dozzle xem log trực quan trên trình duyệt (http://localhost:9999)"
    aliases: [logs:ui]
    cmds:
      - open http://localhost:9999 || start http://localhost:9999

  logs:cli:
    desc: "Xem log thời gian thực của Docker trên Terminal"
    cmds:
      - docker compose logs -f

  # =========================================================================
  # ⚡ 2. HẠ TẦNG & LOCAL FAST DEV MODE (Dành cho Dev từng Service)
  # =========================================================================

  infra:
    desc: "Chỉ bật Hạ tầng (Postgres, Redis, RabbitMQ, Eureka, Config, Gateway) để code service bên ngoài"
    cmds:
      - docker compose up -d --wait postgres redis rabbitmq eureka-server config-server api-gateway

  db:up:
    desc: "Chỉ bật Database & Middleware cốt lõi (Postgres, Redis, RabbitMQ)"
    cmds:
      - docker compose up -d --wait postgres redis rabbitmq

  dev:auth:
    desc: "Chạy auth-service ở máy local kèm Hot-Reload (DevTools)"
    cmds:
      - "{{.MVNW_CMD}} spring-boot:run -pl auth-service"

  dev:catalog:
    desc: "Chạy catalog-service ở máy local kèm Hot-Reload (DevTools)"
    cmds:
      - "{{.MVNW_CMD}} spring-boot:run -pl catalog-service"

  dev:cart:
    desc: "Chạy cart-service ở máy local kèm Hot-Reload (DevTools)"
    cmds:
      - "{{.MVNW_CMD}} spring-boot:run -pl cart-service"

  dev:order:
    desc: "Chạy order-service ở máy local kèm Hot-Reload (DevTools)"
    cmds:
      - "{{.MVNW_CMD}} spring-boot:run -pl order-service"

  dev:payment:
    desc: "Chạy payment-service ở máy local kèm Hot-Reload (DevTools)"
    cmds:
      - "{{.MVNW_CMD}} spring-boot:run -pl payment-service"

  dev:notification:
    desc: "Chạy notification-service ở máy local kèm Hot-Reload (DevTools)"
    cmds:
      - "{{.MVNW_CMD}} spring-boot:run -pl notification-service"

  # =========================================================================
  # 🛠️ 3. BUILD, FORMAT & TESTING UTILITIES
  # =========================================================================

  format:
    desc: "Format lại mã nguồn Java theo chuẩn Google Style (Spotless)"
    env:
      MAVEN_OPTS: "--add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED"
    cmds:
      - "{{.MVNW_CMD}} spotless:apply"

  format:check:
    desc: "Kiểm tra định dạng code Java xem đã chuẩn Spotless chưa"
    env:
      MAVEN_OPTS: "--add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED"
    cmds:
      - "{{.MVNW_CMD}} spotless:check"

  build:
    desc: "Build file Jar ở ngoài máy host (nếu không dùng Docker)"
    cmds:
      - "{{.MVNW_CMD}} clean package -DskipTests"

  test:
    desc: "Chạy Unit Tests"
    cmds:
      - "{{.MVNW_CMD}} test"

  # =========================================================================
  # 📊 4. K6 PERFORMANCE & LOAD TESTING UTILITIES
  # =========================================================================

  k6:smoke:
    desc: "Chạy k6 Smoke Test (30s verification)"
    cmds:
      - k6 run k6/scenarios/01_smoke_test.js

  k6:browse:
    desc: "Chạy k6 Catalog & Search Read-Heavy Load Test"
    cmds:
      - k6 run k6/scenarios/02_browse_catalog.js

  k6:cart:
    desc: "Chạy k6 Redis Cart High-Concurrency Load Test"
    cmds:
      - k6 run k6/scenarios/03_cart_operations.js

  k6:checkout:
    desc: "Chạy k6 End-to-End Checkout & Payment Flow Load Test"
    cmds:
      - k6 run k6/scenarios/04_checkout_order.js

  k6:stress:
    desc: "Chạy k6 System Stress Test (Ramping up to 300 VUs)"
    cmds:
      - k6 run k6/scenarios/05_stress_test.js

  k6:spike:
    desc: "Chạy k6 Flash Sale Spike Test (0 -> 250 VUs in 10s)"
    cmds:
      - k6 run k6/scenarios/06_spike_test.js

  k6:edge:
    desc: "Chạy k6 Edge Cases & Resilience Chaos Test"
    cmds:
      - k6 run k6/scenarios/07_edge_cases.js

  k6:full:
    desc: "Chạy k6 Master Suite (Toàn bộ scenarios với tỷ lệ lưu lượng thực tế)"
    cmds:
      - k6 run k6/main_suite.js

