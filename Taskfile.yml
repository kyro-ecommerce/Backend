version: "3"

dotenv: ['.env']

vars:
  MVNW_CMD: '{{if eq OS "windows"}}mvnw.cmd{{else}}./mvnw{{end}}'

tasks:
  default:
    desc: Lists available tasks
    cmds:
      - task --list

  install:
    desc: "Install / download dependencies"
    cmds:
      - "{{.MVNW_CMD}} dependency:go-offline"

  dev:
    desc: "Build and Run all Spring Cloud Microservices inside Docker"
    cmds:
      - task: build
      - docker compose up --build -d

  run:
    desc: "Run all Spring Cloud Microservices inside Docker (requires build)"
    cmds:
      - docker compose up -d


  stop:
    desc: "Stop all running docker containers"
    cmds:
      - docker compose down

  build:
    desc: "Build Backend Jar"
    cmds:
      - "{{.MVNW_CMD}} clean package -DskipTests"

  test:
    desc: "Run Backend Tests"
    cmds:
      - "{{.MVNW_CMD}} test"

  check:
    desc: "Compile test classes to verify compilation"
    cmds:
      - "{{.MVNW_CMD}} test-compile"

  verify:
    desc: "Full build: clean, build, and test everything"
    cmds:
      - "{{.MVNW_CMD}} clean verify"

  infra:
    desc: "Start Core Infrastructure & Gateway (Postgres, Redis, RabbitMQ, Eureka, Config, Gateway)"
    cmds:
      - docker compose up -d postgres redis rabbitmq eureka-server config-server api-gateway

  dev:auth:
    desc: "Run auth-service locally with Hot-Reload (Fast Dev Mode)"
    cmds:
      - "{{.MVNW_CMD}} spring-boot:run -pl auth-service"

  dev:catalog:
    desc: "Run catalog-service locally with Hot-Reload (Fast Dev Mode)"
    cmds:
      - "{{.MVNW_CMD}} spring-boot:run -pl catalog-service"

  dev:cart:
    desc: "Run cart-service locally with Hot-Reload (Fast Dev Mode)"
    cmds:
      - "{{.MVNW_CMD}} spring-boot:run -pl cart-service"

  dev:order:
    desc: "Run order-service locally with Hot-Reload (Fast Dev Mode)"
    cmds:
      - "{{.MVNW_CMD}} spring-boot:run -pl order-service"

  dev:payment:
    desc: "Run payment-service locally with Hot-Reload (Fast Dev Mode)"
    cmds:
      - "{{.MVNW_CMD}} spring-boot:run -pl payment-service"

  dev:notification:
    desc: "Run notification-service locally with Hot-Reload (Fast Dev Mode)"
    cmds:
      - "{{.MVNW_CMD}} spring-boot:run -pl notification-service"

  db:up:
    desc: "Start local Postgres, Redis, and RabbitMQ using Docker Compose"
    cmds:
      - docker compose up -d postgres redis rabbitmq

  db:down:
    desc: "Stop local Postgres, Redis, and RabbitMQ"
    cmds:
      - docker compose stop postgres redis rabbitmq

  db:down-v:
    desc: "Stop local Postgres database and remove volumes"
    cmds:
      - docker compose down -v

  db:logs:
    desc: "View local database logs"
    cmds:
      - docker compose logs -f

  logs:ui:
    desc: "Open Dozzle Log UI in default browser"
    cmds:
      - open http://localhost:9999

  format:
    desc: "Format the Java codebase using Spotless (Google Java Format)"
    env:
      MAVEN_OPTS: "--add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED"
    cmds:
      - "{{.MVNW_CMD}} spotless:apply"

  format:check:
    desc: "Verify Java codebase formatting using Spotless (Google Java Format)"
    env:
      MAVEN_OPTS: "--add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED"
    cmds:
      - "{{.MVNW_CMD}} spotless:check"
