version: "3"

dotenv: ['.env']

vars:
  MVNW_CMD: '{{if eq OS "windows"}}mvnw.cmd{{else}}./mvnw{{end}}'

tasks:
  default:
    desc: "Danh sách tất cả các lệnh Taskfile khả dụng"
    cmds:
      - task --list

  # =========================================================================
  # 🚀 1. LỆNH CHÍNH (MAIN WORKFLOW - MULTI-STAGE DOCKER)
  # =========================================================================

  run:
    desc: "Chạy TOÀN BỘ hệ thống Microservices trong Docker (Multi-stage Build tự động)"
    aliases: [up, dev]
    cmds:
      - docker compose up --build -d --wait

  stop:
    desc: "Dừng tất cả các Docker containers đang chạy"
    aliases: [down]
    cmds:
      - docker compose down

  clean:
    desc: "Dừng hệ thống và XÓA SẠCH Database Volumes / Cache"
    aliases: [down-v, db:down-v]
    cmds:
      - docker compose down -v

  status:
    desc: "Xem trạng thái sức khỏe của tất cả Docker containers"
    cmds:
      - docker compose ps

  logs:
    desc: "Mở trang UI Dozzle xem log trực quan trên trình duyệt (http://localhost:9999)"
    aliases: [logs:ui]
    cmds:
      - open http://localhost:9999 || start http://localhost:9999

  logs:cli:
    desc: "Xem log thời gian thực của Docker trên Terminal"
    cmds:
      - docker compose logs -f

  # =========================================================================
  # ⚡ 2. DOCKER DEV MODE (Chạy từng service kèm dependencies trong Compose)
  # =========================================================================

  dev:infra:
    desc: "Chạy hạ tầng dùng chung một lần, không build lại image"
    cmds:
      - docker compose up -d --wait postgres redis rabbitmq eureka-server config-server

  dev:auth:
    desc: "Build và chạy auth-service trong Docker, chờ healthy"
    cmds:
      - docker compose up -d --no-deps --build --wait auth-service

  dev:catalog:
    desc: "Build và chạy catalog-service trong Docker, chờ healthy"
    cmds:
      - docker compose up -d --no-deps --build --wait catalog-service

  dev:cart:
    desc: "Build và chạy cart-service trong Docker, chờ healthy"
    cmds:
      - docker compose up -d --no-deps --build --wait cart-service

  dev:order:
    desc: "Build và chạy order-service trong Docker, chờ healthy"
    cmds:
      - docker compose up -d --no-deps --build --wait order-service

  dev:payment:
    desc: "Build và chạy payment-service trong Docker, chờ healthy"
    cmds:
      - docker compose up -d --no-deps --build --wait payment-service

  dev:notification:
    desc: "Build và chạy notification-service trong Docker, chờ healthy"
    cmds:
      - docker compose up -d --no-deps --build --wait notification-service

  dev:gateway:
    desc: "Build và chạy api-gateway trong Docker, chờ healthy"
    cmds:
      - docker compose up -d --no-deps --build --wait api-gateway

  # =========================================================================
  # 🛠️ 3. BUILD, FORMAT & TESTING UTILITIES
  # =========================================================================

  format:
    desc: "Format lại mã nguồn Java theo chuẩn Google Style (Spotless)"
    env:
      MAVEN_OPTS: "--add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED"
    cmds:
      - "{{.MVNW_CMD}} spotless:apply"

  format:check:
    desc: "Kiểm tra định dạng code Java xem đã chuẩn Spotless chưa"
    env:
      MAVEN_OPTS: "--add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED"
    cmds:
      - "{{.MVNW_CMD}} spotless:check"

  build:
    desc: "Build file Jar ở ngoài máy host (nếu không dùng Docker)"
    cmds:
      - "{{.MVNW_CMD}} clean package -DskipTests"

  test:
    desc: "Chạy Unit Tests"
    cmds:
      - "{{.MVNW_CMD}} test"

  perf:feign:
    desc: "Đo luồng Feign đồng bộ khi tạo order"
    cmds:
      - ./k6/performance/run.sh feign

  perf:rabbitmq:
    desc: "Đo luồng RabbitMQ từ Payment sang Order"
    cmds:
      - ./k6/performance/run.sh rabbitmq

  perf:payment-failure:
    desc: "Mô phỏng VNPay từ chối thanh toán và kiểm tra đồng bộ RabbitMQ"
    cmds:
      - ./k6/performance/run.sh payment-failure

  perf:reset:
    desc: "Xóa fixture performance và phục hồi stock seed"
    cmds:
      - ./k6/performance/run.sh reset
