name: kyro-backend

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kyro-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres_password}
      POSTGRES_DB: ${DATABASE_DB:-postgres}
    volumes:
      - kyro_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    restart: always

  redis:
    image: redis:7-alpine
    container_name: kyro-redis
    ports:
      - "6379:6379"
    restart: always

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: kyro-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: kyro-eureka-server
    ports:
      - "8761:8761"
    restart: always

  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: kyro-config-server
    ports:
      - "8888:8888"
    depends_on:
      - eureka-server
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    restart: always

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: kyro-api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - config-server
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    restart: always

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: kyro-auth-service
    ports:
      - "8081:8081"
    depends_on:
      - config-server
      - postgres
      - rabbitmq
    env_file:
      - .env
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      DATABASE_URL: jdbc:postgresql://kyro-postgres:5432/kyro_auth
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres_password}
      RABBITMQ_HOST: kyro-rabbitmq
      OAUTH2_GOOGLE_CLIENT_ID: ${OAUTH2_GOOGLE_CLIENT_ID}
      OAUTH2_GOOGLE_CLIENT_SECRET: ${OAUTH2_GOOGLE_CLIENT_SECRET}
      OAUTH2_GITHUB_CLIENT_ID: ${OAUTH2_GITHUB_CLIENT_ID}
      OAUTH2_GITHUB_CLIENT_SECRET: ${OAUTH2_GITHUB_CLIENT_SECRET}
      OAUTH2_REDIRECT_URI: ${OAUTH2_REDIRECT_URI:-http://localhost:5173/oauth2/redirect}
      OAUTH2_FAILURE_REDIRECT_URI: ${OAUTH2_FAILURE_REDIRECT_URI:-http://localhost:5173/login?error=true}
    restart: always

  catalog-service:
    build:
      context: ./catalog-service
      dockerfile: Dockerfile
    container_name: kyro-catalog-service
    ports:
      - "8082:8082"
    depends_on:
      - config-server
      - postgres
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      DATABASE_URL: jdbc:postgresql://kyro-postgres:5432/kyro_catalog
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres_password}
    restart: always

  cart-service:
    build:
      context: ./cart-service
      dockerfile: Dockerfile
    container_name: kyro-cart-service
    ports:
      - "8083:8083"
    depends_on:
      - config-server
      - redis
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      REDIS_HOST: kyro-redis
    restart: always

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: kyro-notification-service
    ports:
      - "8084:8084"
    depends_on:
      - config-server
      - rabbitmq
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      RABBITMQ_HOST: kyro-rabbitmq
    restart: always

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: kyro-order-service
    ports:
      - "8085:8085"
    depends_on:
      - config-server
      - postgres
      - rabbitmq
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      DATABASE_URL: jdbc:postgresql://kyro-postgres:5432/kyro_order
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres_password}
      RABBITMQ_HOST: kyro-rabbitmq
    restart: always

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: kyro-payment-service
    ports:
      - "8086:8086"
    depends_on:
      - config-server
      - postgres
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      DATABASE_URL: jdbc:postgresql://kyro-postgres:5432/kyro_payment
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres_password}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET}
      VNPAY_PAY_URL: ${VNPAY_PAY_URL}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL}
    restart: always

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: kyro-ai-service
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - rabbitmq
    environment:
      DATABASE_URL: postgresql+psycopg://${DATABASE_USERNAME:-postgres}:${DATABASE_PASSWORD:-postgres_password}@kyro-postgres:5432/postgres
      RABBITMQ_URL: amqp://guest:guest@kyro-rabbitmq:5672/
      RABBITMQ_HOST: kyro-rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      GEMINI_API_KEY: ${GEMINI_API_KEY:-""}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: always

  dozzle:
    image: amir20/dozzle:latest
    container_name: kyro-dozzle
    ports:
      - "9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always


volumes:
  kyro_postgres_data:

